<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-white dark:bg-gray-900">
    <div class="relative p-8 h-screen min-h-screen max-w-7xl mx-auto">
      <header
        class="flex justify-between items-baseline text-gray-900 dark:text-white"
      >
        <a
          class="mb-4 text-4xl tracking-tight font-bold hover:underline"
          href=""
        >
          Password Protected Pages: Admin
        </a>
      </header>
      <section
        id="openConfigSection"
        role="status"
        class="h-3/4 flex items-center justify-center"
      >
        <button
          id="openConfigButton"
          type="button"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 mr-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800"
        >
          Open config file to start
        </button>
      </section>
      <section id="tableSection" class="hidden bg-gray-50 dark:bg-gray-900">
        <div
          class="bg-white dark:bg-gray-800 relative shadow-md sm:rounded-lg overflow-hidden"
        >
          <div
            class="flex flex-col md:flex-row items-center justify-between space-y-3 md:space-y-0 md:space-x-4 p-4"
          >
            <div class="w-full md:w-1/2">
              <form class="flex items-center">
                <label for="simple-search" class="sr-only">Search</label>
                <div class="relative w-full">
                  <div
                    class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
                  >
                    <svg
                      aria-hidden="true"
                      class="w-5 h-5 text-gray-500 dark:text-gray-400"
                      fill="currentColor"
                      viewbox="0 0 20 20"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                        clip-rule="evenodd"
                      />
                    </svg>
                  </div>
                  <input
                    type="text"
                    id="simple-search"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    placeholder="Search"
                    required=""
                  />
                </div>
              </form>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table
              class="w-full text-sm text-left text-gray-500 dark:text-gray-400"
            >
              <thead
                class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
              >
                <tr>
                  <th scope="col" class="px-4 py-3">Project Slug</th>
                  <th scope="col" class="px-4 py-3">Live?</th>
                  <th scope="col" class="px-4 py-3">Open Time</th>
                  <th scope="col" class="px-4 py-3">Close Time</th>
                  <th scope="col" class="px-4 py-3">
                    <span class="sr-only">Actions</span>
                  </th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <script>
      const openConfigSection = document.querySelector("#openConfigSection");
      const openConfigButton = document.querySelector(
        "#openConfigSection button"
      );
      const tableSection = document.querySelector("#tableSection");
      const tableSectionTableBody = document.querySelector(
        "#tableSection tbody"
      );

      var config = null;

      openConfigButton.onclick = async () => {
        const pickerOpts = {
          types: [
            {
              description: "JSON Config",
              accept: { "json/*": [".json"] },
            },
          ],
          excludeAcceptAllOption: true,
          multiple: false,
        };
        const result = await window.showOpenFilePicker(pickerOpts);
        const file = await result[0].getFile();
        const fileContent = await file.text();
        config = JSON.parse(fileContent);
        console.log(config);

        config.sites.forEach((site) => {
          tableSectionTableBody.innerHTML +=
            `
        <tr class="border-b dark:border-gray-700">
                  <th
                    scope="row"
                    class="px-4 py-3 font-medium text-gray-900 whitespace-nowrap dark:text-white"
                  >` + site.slug + `
                  </th>
                  <td class="px-4 py-3">` + (site.live ? "Yes" : "No") +
                `</td>
                  <td class="px-4 py-3">-</td>
                  <td class="px-4 py-3">-</td>
                  <td class="px-4 py-3 flex items-center justify-end">
                    <button
                      id="apple-imac-27-dropdown-button"
                      data-dropdown-toggle="apple-imac-27-dropdown"
                      class="inline-flex items-center p-0.5 text-sm font-medium text-center text-gray-500 hover:text-gray-800 rounded-lg focus:outline-none dark:text-gray-400 dark:hover:text-gray-100"
                      type="button"
                    >
                      Edit
                    </button>
                  </td>
                </tr>
        `;
        });

        openConfigSection.classList.add("hidden");
        tableSection.classList.remove("hidden");
      };
    </script>
  </body>
</html>
